name: CI

on:
  push:
    branches: [main, fase-0-migracion]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El lint aún no bloquea: hay ~150 errores heredados (no-explicit-any)
      # que se limpiarán en la Fase 2. Se muestra el resultado sin cortar el CI.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Reglas de hooks de React (bloqueante)
        run: npm run check:hooks

      # Mismos valores de relleno que el build. Un test que importe (aunque sea
      # de forma indirecta) el cliente de Supabase revienta al cargar el módulo
      # si no existen, y el fallo aparenta ser del test cuando no lo es.
      - name: Tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          VITE_SUPABASE_PROJECT_ID: ci-placeholder

      # El .env real no está en el repositorio. Se usan valores de relleno para
      # que el build sea representativo: sin ellos el cliente de Supabase
      # revienta al importarse y el bundle sale roto sin avisar.
      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
