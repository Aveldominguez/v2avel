  <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <!--
      El color de fondo y el tema, ANTES de descargar nada.

      Sin esto el móvil enseñaba una pantalla BLANCA desde que abres la app
      hasta que termina de cargar y arrancar el JavaScript: con la app en tema
      oscuro y un teléfono normal en el aeropuerto, eso son varios segundos en
      blanco cada vez que Android descarta la pestaña por dejarla un rato de
      fondo. El tema se aplicaba en main.tsx, que es lo ÚLTIMO que se ejecuta.

      Esto pinta el fondo correcto en el primer instante y deja un indicador
      de carga visible, que React sustituye al montar.
    -->
    <style>
      html { background: hsl(216 54% 12%); }
      html.light { background: hsl(220 20% 97%); }
      html.exterior { background: hsl(0 0% 100%); }
      html.sky { background: hsl(220 42% 96%); }
      html.aero { background: hsl(216 54% 12%); }
      body { margin: 0; background: inherit; }
      #arranque {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
      }
      #arranque i {
        width: 2rem; height: 2rem; border-radius: 50%;
        border: 3px solid hsl(210 40% 60% / 0.25);
        border-top-color: hsl(210 90% 60%);
        animation: girar 0.8s linear infinite;
      }
      @keyframes girar { to { transform: rotate(360deg); } }
      #tarda {
        max-width: 22rem; margin: 0 1.5rem; text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        color: hsl(210 20% 60%);
      }
      #tarda b { display: block; font-size: 1.05rem; margin-bottom: .4rem; color: hsl(210 25% 75%); }
      html.light #tarda, html.sky #tarda { color: hsl(215 16% 40%); }
      html.light #tarda b, html.sky #tarda b { color: hsl(215 25% 20%); }
      #tarda button {
        margin-top: 1rem; padding: .7rem 1.4rem; font: inherit; font-weight: 600;
        border: 0; border-radius: .6rem; background: hsl(210 90% 50%); color: #fff;
      }
    </style>
    <script>
      // Mismo criterio que src/lib/theme.ts: por defecto 'aero'.
      try {
        var t = localStorage.getItem('theme') || 'aero';
        var r = document.documentElement;
        if (t === 'light' || t === 'exterior') r.classList.add('light');
        if (t === 'exterior') r.classList.add('exterior');
        if (t === 'sky') r.classList.add('sky');
        if (t === 'aero') r.classList.add('aero');
      } catch (e) { document.documentElement.classList.add('aero'); }
    </script>
</head>

  <body>
    <div id="root"><div id="arranque"><i></i></div></div>
    <!--
      Vigilante de arranque.

      Si la app no ha pintado nada en 10 segundos, esta pantalla deja de estar
      en blanco y dice lo que pasa. Con cobertura mala (un 3G de una barra en
      rampa) el móvil puede quedarse esperando el JavaScript sin dar señales, y
      el operario no sabe si esperar, cerrar o que se ha roto algo.

      Va en HTML y JavaScript corriente, sin depender de nada que haya que
      descargar: es lo único que sigue funcionando cuando no llega lo demás.
    -->
    <script>
      (function () {
        var t = setTimeout(function () {
          if (window.__appMontada) return;
          var n = document.getElementById('arranque');
          if (!n) return;
          var offline = !navigator.onLine;
          n.innerHTML =
            '<div id="tarda">' +
              '<b>' + (offline ? 'Sin conexión' : 'La app está tardando en abrir') + '</b>' +
              (offline
                ? 'No hay cobertura y la app aún no se ha guardado entera en este móvil. Busca un sitio con señal y vuelve a intentarlo.'
                : 'La cobertura es muy débil. Tus escalas guardadas están a salvo; esto es solo la carga.') +
              '<br><button type="button" onclick="location.reload()">Reintentar</button>' +
            '</div>';
          try {
            localStorage.setItem('arranque_lento', JSON.stringify({
              cuando: new Date().toISOString(),
              online: navigator.onLine,
              // Si esto es false, la página NO la sirvió la copia guardada en
              // el móvil, y ahí está la causa de la pantalla en blanco.
              servidaPorSW: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
              tipoRed: (navigator.connection && navigator.connection.effectiveType) || null
            }));
          } catch (e) {}
        }, 10000);
        window.__cancelarVigilante = function () { clearTimeout(t); };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
