name = "fotos-v2avel"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# El cubo se conecta por dentro de Cloudflare: no hacen falta credenciales
# de R2 en ninguna parte. La jurisdicción tiene que coincidir con la que se
# eligió al crearlo (European Union) o el enlace no encuentra el cubo.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "v2avel-fotos"
jurisdiction = "eu"

# Crea también el registro DNS de fotos.devavel.com.
[[routes]]
pattern = "fotos.devavel.com"
custom_domain = true

